# Local development only: standalone initializes SQLite and starts Airflow services.
services:
  airflow:
    build: .
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ACCOUNTING_DATA_ROOT: /opt/airflow/data
      ACCOUNTING_RECONCILIATION_MODE: ${ACCOUNTING_RECONCILIATION_MODE:-strict}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
      - airflow-home:/opt/airflow
volumes:
  airflow-home:
